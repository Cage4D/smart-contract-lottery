[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@chainlink/contracts/=lib/chainlink-evm/contracts/", "@openzeppelin/contracts@4.9.6/=lib/openzeppelin-contracts/contracts/", "@solmate/tokens=lib/solmate/src/tokens/"]
fs_permissions = [
    { access = "read", path = "./broadcast"},
    { access = "read", path = "./reports"},
]